<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken GAME!</title>
</head>

<body>
  <div th:if="${name}">
    Hi [[${name}]]
  </div>

  <p>
    <a href="/fight?hand=グー">グー</a> |
    <a href="/fight?hand=チョキ">チョキ</a> |
    <a href="/fight?hand=パー">パー</a>
  </p>

  <div th:if="${playerHand}">
    <p>あなたの手: <span th:text="${playerHand}"></span></p>
    <p>相手の手: <span th:text="${cpuHand}"></span></p>
    <p>結果: <span th:text="${result}"></span></p>
  </div>

</body>

</html>
