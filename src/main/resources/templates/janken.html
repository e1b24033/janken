<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken GAME!</title>
</head>

<body>

  <p>
    <a href="/logout">ログアウト</a>
  </p>

  <h1>Janken GAME!</h1>

  <div th:if="${loginUser}">
    Hi <span th:text="${loginUser}"></span>
  </div>

  <h2>エントリー</h2>
  <ul>
    <li th:each="user : ${users}" th:text="${user.name}"></li>
  </ul>

  <!-- <ul>
    <li th:each="user : ${room.users}" th:text="${user}"></li>
  </ul>

  <div th:if="${name}">
    Hi [[${name}]]
  </div>

  <div th:if="${loginUser}">
    Hi <span th:text="${loginUser}"></span>
  </div> -->
  <h2>試合結果</h2>
  <ul>
    <li th:each="match : ${matches}">
      id: [[${match.id}]] | user1: [[${match.user1}]] | user2: [[${match.user2}]] | user1の手: [[${match.user1Hand}]] |
      user2の手: [[${match.user2Hand}]]
    </li>
  </ul>

  <p>
    <a href="/fight?hand=グー">グー</a> |
    <a href="/fight?hand=チョキ">チョキ</a> |
    <a href="/fight?hand=パー">パー</a>
  </p>

  <div th:if="${playerHand}">
    <p>あなたの手: <span th:text="${playerHand}"></span></p>
    <p>相手の手: <span th:text="${cpuHand}"></span></p>
    <p>結果: <span th:text="${result}"></span></p>
  </div>

</body>

</html>
